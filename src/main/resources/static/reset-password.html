<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AI Fake News Detector</title>
    <link rel="stylesheet" href="/css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">FakeNewsAI</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login.html">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="auth-card">
            <h2>Choose New Password</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.875rem;">Enter the 6-digit OTP sent to your email, along with your secure new password.</p>
            <div id="msg" class="msg"></div>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="otp">Email OTP</label>
                    <input type="text" id="otp" class="form-control" maxlength="6" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" class="form-control" required>
                </div>
                <!-- Hidden email field passed via sessionStorage -->
                <input type="hidden" id="resetEmail">
                <button type="submit" class="btn">Reset Password</button>
            </form>
        </div>
    </div>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const email = sessionStorage.getItem('resetEmail');
            if (email) {
                document.getElementById('resetEmail').value = email;
            } else {
                window.location.href = '/forgot-password.html';
            }
        });
    </script>
</body>
</html>
