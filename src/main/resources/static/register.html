<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Fake News Detector</title>
    <link rel="stylesheet" href="/css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">FakeNewsAI</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login.html">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="auth-card">
            <h2>Create an Account</h2>
            <div id="msg" class="msg"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn">Register</button>
                <div style="text-align: center; margin-top: 1rem;">
                    <span style="color: var(--text-muted); font-size: 0.875rem;">Already have an account? </span>
                    <a href="/login.html" style="color: var(--primary); font-size: 0.875rem; text-decoration: none; font-weight: 600;">Login</a>
                </div>
            </form>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
