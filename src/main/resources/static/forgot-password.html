<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AI Fake News Detector</title>
    <link rel="stylesheet" href="/css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">FakeNewsAI</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login.html">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="auth-card">
            <h2>Reset Password</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.875rem;">Enter your email address to receive a secure One-Time Password (OTP) for resetting your password.</p>
            <div id="msg" class="msg"></div>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <button type="submit" class="btn">Send OTP</button>
            </form>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
