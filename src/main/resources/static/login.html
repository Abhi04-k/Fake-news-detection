<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Fake News Detector</title>
    <link rel="stylesheet" href="/css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="brand">FakeNewsAI</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/register.html">Create Account</a>
        </div>
    </nav>

    <div class="container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <div id="msg" class="msg"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn">Login</button>
                <div style="text-align: center; margin-top: 1rem;">
                    <a href="/forgot-password.html" style="color: var(--primary); font-size: 0.875rem; text-decoration: none;">Forgot Password?</a>
                </div>
                <div style="text-align: center; margin-top: 0.75rem;">
                    <span style="color: var(--text-muted); font-size: 0.875rem;">Don't have an account? </span>
                    <a href="/register.html" style="color: var(--primary); font-size: 0.875rem; text-decoration: none; font-weight: 600;">Create Account</a>
                </div>
            </form>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
